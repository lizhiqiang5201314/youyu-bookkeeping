name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --registry=https://registry.npmmirror.com
        
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.REMOTE_HOST }}
        USER: ${{ secrets.REMOTE_USER }}
      run: |
        # 设置 SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # 调试：检查密钥是否正确写入（只显示长度）
        echo "🔑 SSH Key 长度: $(wc -c < ~/.ssh/deploy_key)"
        echo "🖥️  目标服务器: $USER@$HOST"
        
        # 测试 SSH 连接
        echo "🔌 测试 SSH 连接..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 $USER@$HOST "echo '✅ SSH 连接成功'" || {
          echo "❌ SSH 连接失败"
          exit 1
        }
        
        # 压缩 dist 目录
        echo "📦 压缩文件..."
        tar -czvf dist.tar.gz dist/
        
        # 上传并解压
        echo "📤 上传到服务器..."
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null dist.tar.gz $USER@$HOST:/tmp/ || {
          echo "❌ 文件上传失败"
          exit 1
        }
        
        echo "📂 解压并部署..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST "
          cd /tmp &&
          rm -rf /var/www/youyu/* &&
          tar -xzvf dist.tar.gz &&
          cp -r dist/* /var/www/youyu/ &&
          rm -rf dist dist.tar.gz &&
          sudo systemctl restart nginx &&
          echo '✅ 部署完成'
        " || {
          echo "❌ 部署步骤失败"
          exit 1
        }
        
        echo "✅ GitHub Actions 部署成功！"
