name: Build and Deploy

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --registry=https://registry.npmmirror.com
        
    - name: Build project
      run: npm run build
      
    - name: Check secrets
      run: |
        echo "🔍 检查 Secrets 配置..."
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "❌ SSH_PRIVATE_KEY 未配置"
          exit 1
        else
          echo "✅ SSH_PRIVATE_KEY 已配置"
          echo "🔑 Key 长度: $(echo '${{ secrets.SSH_PRIVATE_KEY }}' | wc -c)"
        fi
        
        if [ -z "${{ secrets.REMOTE_HOST }}" ]; then
          echo "❌ REMOTE_HOST 未配置"
          exit 1
        else
          echo "✅ REMOTE_HOST 已配置"
        fi
        
        if [ -z "${{ secrets.REMOTE_USER }}" ]; then
          echo "❌ REMOTE_USER 未配置"
          exit 1
        else
          echo "✅ REMOTE_USER 已配置"
        fi

        if [ -n "${{ secrets.REMOTE_PORT }}" ]; then
          echo "✅ REMOTE_PORT 已配置"
        else
          echo "ℹ️ REMOTE_PORT 未配置，将默认使用 22"
        fi

    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.REMOTE_HOST }}
        USER: ${{ secrets.REMOTE_USER }}
        PORT: ${{ secrets.REMOTE_PORT }}
      run: |
        set -eu

        # 设置 SSH
        mkdir -p ~/.ssh
        # 使用 printf 保留换行符
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        PORT="${PORT:-22}"
        SSH_OPTS="-i ~/.ssh/deploy_key -p ${PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
        SCP_OPTS="-i ~/.ssh/deploy_key -P ${PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"

        # 生成公钥与指纹，方便和服务器 authorized_keys 对照
        ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
        
        # 调试：检查密钥是否正确写入
        echo "🔑 SSH Key 文件大小: $(wc -c < ~/.ssh/deploy_key)"
        echo "🔑 SSH Key 行数: $(wc -l < ~/.ssh/deploy_key)"
        echo "🔑 SSH 公钥指纹: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2, $4}')"
        echo "🖥️  目标服务器: $USER@$HOST:$PORT"
        echo "🔑 请确认服务器 authorized_keys 中包含下面这把公钥："
        cat ~/.ssh/deploy_key.pub
        
        # 测试 SSH 连接
        echo "🔌 测试 SSH 连接..."
        ssh $SSH_OPTS $USER@$HOST "echo '✅ SSH 连接成功'; whoami; hostname" || {
          echo "❌ SSH 连接失败"
          echo "👉 请核对 REMOTE_USER 是否和服务器 authorized_keys 所属用户一致"
          echo "👉 如果公钥加在 /root/.ssh/authorized_keys，就必须用 root 登录"
          exit 1
        }
        
        # 压缩 dist 目录
        echo "📦 压缩文件..."
        tar -czvf dist.tar.gz dist/
        ARCHIVE_PATH="/tmp/youyu-dist.tar.gz"
        RELEASE_DIR="/tmp/youyu-dist"
        
        # 上传并解压
        echo "📤 上传到服务器..."
        scp $SCP_OPTS dist.tar.gz $USER@$HOST:$ARCHIVE_PATH || {
          echo "❌ 文件上传失败"
          exit 1
        }

        echo "🧾 检查远端压缩包..."
        ssh $SSH_OPTS $USER@$HOST "ls -lh $ARCHIVE_PATH" || {
          echo "❌ 远端压缩包不存在"
          exit 1
        }
        
        echo "📂 解压并部署..."
        ssh $SSH_OPTS $USER@$HOST "
          set -eu
          ARCHIVE_PATH='$ARCHIVE_PATH'
          RELEASE_DIR='$RELEASE_DIR'
          rm -rf \"\$RELEASE_DIR\"
          mkdir -p \"\$RELEASE_DIR\"
          tar -xzvf \"\$ARCHIVE_PATH\" -C \"\$RELEASE_DIR\"
          if [ \"\$(id -u)\" -eq 0 ]; then
            install -d -m 755 /var/www/youyu/dist
            rm -rf /var/www/youyu/dist/*
            cp -r \"\$RELEASE_DIR\"/dist/* /var/www/youyu/dist/
            systemctl restart nginx
          else
            sudo install -d -m 755 /var/www/youyu/dist
            sudo rm -rf /var/www/youyu/dist/*
            sudo cp -r \"\$RELEASE_DIR\"/dist/* /var/www/youyu/dist/
            sudo systemctl restart nginx
          fi
          rm -rf \"\$RELEASE_DIR\" \"\$ARCHIVE_PATH\"
          echo '✅ 部署完成'
        " || {
          echo "❌ 部署步骤失败"
          exit 1
        }
        
        echo "✅ GitHub Actions 部署成功！"
