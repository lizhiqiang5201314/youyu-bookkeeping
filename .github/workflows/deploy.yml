name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --registry=https://registry.npmmirror.com
        
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      env:
        PRIVATE_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.REMOTE_HOST }}
        USER: ${{ secrets.REMOTE_USER }}
      run: |
        # 解码 base64 私钥
        mkdir -p ~/.ssh
        echo "$PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # 添加服务器到 known_hosts
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
        
        # 部署文件
        rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" --delete dist/ $USER@$HOST:/var/www/youyu/
        
        # 重启 Nginx
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST "sudo systemctl restart nginx"
        
        echo "✅ 部署完成"
