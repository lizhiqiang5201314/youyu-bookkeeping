name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --registry=https://registry.npmmirror.com
        
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      env:
        HOST: ${{ secrets.REMOTE_HOST }}
        USER: ${{ secrets.REMOTE_USER }}
        PASS: ${{ secrets.REMOTE_PASSWORD }}
      run: |
        # 安装 sshpass
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # 添加服务器到 known_hosts
        mkdir -p ~/.ssh
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
        
        # 使用密码方式部署
        sshpass -p "$PASS" rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" dist/ $USER@$HOST:/var/www/youyu/
        
        # 重启 Nginx
        sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no $USER@$HOST "sudo systemctl restart nginx"
        
        echo "✅ 部署完成"
