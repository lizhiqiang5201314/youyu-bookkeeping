name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --registry=https://registry.npmmirror.com
        
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.REMOTE_HOST }}
        USER: ${{ secrets.REMOTE_USER }}
      run: |
        # 安装 SSH 客户端
        sudo apt-get update -qq
        sudo apt-get install -y -qq openssh-client rsync
        
        # 设置 SSH 密钥
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # 添加主机到 known_hosts
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
        
        # 部署文件
        echo "📤 正在部署到服务器..."
        rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" dist/ $USER@$HOST:/var/www/youyu/
        
        # 重启 Nginx
        echo "🔄 重启 Nginx..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST "sudo systemctl restart nginx"
        
        echo "✅ 部署完成！"
