<!-- 有鱼记账 Logo SVG -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="fishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0091EA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#fishGradient)" filter="url(#shadow)"/>
  
  <!-- 鱼身 -->
  <ellipse cx="100" cy="100" rx="45" ry="28" fill="white"/>
  
  <!-- ¥ 符号 -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#00BFA5" text-anchor="middle">¥</text>
  
  <!-- 鱼眼 -->
  <circle cx="135" cy="88" r="6" fill="#00BFA5"/>
  <circle cx="137" cy="86" r="2" fill="white"/>
  
  <!-- 鱼尾 -->
  <path d="M 55 100 L 35 75 L 35 125 Z" fill="white"/>
  
  <!-- 鱼鳍 -->
  <path d="M 90 75 Q 100 60 110 75" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
