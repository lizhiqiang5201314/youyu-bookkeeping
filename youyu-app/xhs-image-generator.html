<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书配图生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; }
        #canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        canvas {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 100%;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); }
        .tips {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 小红书配图生成器</h1>
        
        <div id="canvas-container">
            <canvas id="xhsCanvas" width="900" height="1200"></canvas>
        </div>
        
        <a id="downloadBtn" class="btn" download="小红书配图.png">📥 下载图片</a>
        
        <div class="tips">
            <strong>使用说明：</strong><br>
            1. 点击图片查看效果<br>
            2. 点击"下载图片"保存<br>
            3. 上传到小红书发布
        </div>
    </div>

    <script>
        const canvas = document.getElementById('xhsCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        function drawCard() {
            // 背景渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, 1200);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(0.5, '#764ba2');
            gradient.addColorStop(1, '#f093fb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 900, 1200);

            // 装饰圆
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(750, 200, 150, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(100, 1000, 100, 0, Math.PI * 2);
            ctx.fill();

            // 白色卡片
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.beginPath();
            ctx.roundRect(50, 150, 800, 900, 30);
            ctx.fill();

            // 标题
            ctx.fillStyle = '#333';
            ctx.font = 'bold 48px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🍎 求助！借个苹果开发者账号', 450, 230);

            // 副标题
            ctx.fillStyle = '#666';
            ctx.font = '28px -apple-system, sans-serif';
            ctx.fillText('想上架个记账App，688年费好贵啊', 450, 280);

            // 分隔线
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(100, 320);
            ctx.lineTo(800, 320);
            ctx.stroke();

            // 内容列表
            const items = [
                { emoji: '💰', text: '年费 ¥688 有点小贵' },
                { emoji: '📱', text: 'App已开发完成，就差上架' },
                { emoji: '🔒', text: '只借用账号，不碰其他' },
                { emoji: '💵', text: '可付费租借，价格好商量' },
                { emoji: '⏰', text: '使用期：3-6个月即可' }
            ];

            let y = 400;
            items.forEach((item) => {
                // emoji
                ctx.font = '40px Arial';
                ctx.fillText(item.emoji, 150, y);
                
                // 文字
                ctx.fillStyle = '#333';
                ctx.font = '32px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(item.text, 220, y);
                
                y += 90;
            });

            // 底部提示
            ctx.fillStyle = '#667eea';
            ctx.textAlign = 'center';
            ctx.font = 'bold 36px -apple-system, sans-serif';
            ctx.fillText('👇 有账号的大佬看看我', 450, 920);

            // 标签背景
            const tags = ['#iOS开发', '#苹果开发者', '#独立开发者', '#App上架', '#求助'];
            let tagX = 120;
            ctx.font = '22px -apple-system, sans-serif';
            
            tags.forEach(tag => {
                const width = ctx.measureText(tag).width + 20;
                
                // 标签背景
                ctx.fillStyle = 'rgba(102,126,234,0.15)';
                ctx.beginPath();
                ctx.roundRect(tagX - 10, 960, width, 36, 18);
                ctx.fill();
                
                // 标签文字
                ctx.fillStyle = '#667eea';
                ctx.fillText(tag, tagX + width/2 - 10, 985);
                tagX += width + 15;
            });

            // 底部互动
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 40px -apple-system, sans-serif';
            ctx.fillText('❤️ 点赞  💬 评论  ⭐ 收藏', 450, 1120);

            // 更新下载链接
            downloadBtn.href = canvas.toDataURL('image/png');
        }

        // 绘制
        drawCard();

        // 点击重绘
        canvas.addEventListener('click', drawCard);
    </script>
</body>
</html>
